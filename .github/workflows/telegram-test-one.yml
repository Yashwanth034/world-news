name: telegram one-message test (manual only)

on:
  workflow_dispatch:

concurrency:
  group: telegram-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-one:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore runtime state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/news.db
            data/telegram_queue.json
            data/telegram_state.json
          key: world-news-runtime-${{ github.run_id }}
          restore-keys: |
            world-news-runtime-

      - name: SAFETY CHECK - exactly one scheduled due post
        shell: bash
        env:
          TELEGRAM_NO_RETRY: "1"
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          if os.environ.get('TELEGRAM_NO_RETRY') != '1':
              print('ABORT: TELEGRAM_NO_RETRY must be 1 for one-message test')
              sys.exit(1)
          state = json.load(open('data/telegram_state.json'))
          queue = json.load(open('data/telegram_queue.json'))
          sched = state.get('scheduled', [])
          posted = state.get('posted', [])
          queue_count = queue.get('count', len(queue.get('stories', [])))
          if len(sched) != 1:
              print(f'ABORT: expected exactly 1 scheduled entry, found {len(sched)}')
              sys.exit(1)
          if queue_count != 1:
              print(f'ABORT: expected exactly 1 queue story, found {queue_count}')
              sys.exit(1)
          if len(posted) != 0:
              print(f'ABORT: expected 0 posted entries, found {len(posted)}')
              sys.exit(1)
          due = datetime.fromisoformat(sched[0]['scheduled_at'].replace('Z', '+00:00'))
          if due.tzinfo is None:
              due = due.replace(tzinfo=timezone.utc)
          if due > datetime.now(timezone.utc):
              print('ABORT: scheduled entry is not due yet')
              sys.exit(1)
          print('OK: exactly 1 scheduled (due), 0 posted, 1 queue story, no-retry on ->',
                sched[0]['story_id'][:12])
          PYEOF

      - name: Publish exactly one message
        id: publish
        run: python -m src.telegram_run --force --yes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_NO_RETRY: "1"

      - name: Report result
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json
          state = json.load(open('data/telegram_state.json'))
          posted = state.get('posted', [])
          sched = state.get('scheduled', [])
          print('scheduler state after run:')
          print('  scheduled entries :', len(sched))
          print('  posted entries    :', len(posted))
          print('  failure entries   :', len(state.get('failures', [])))
          if posted:
              last = posted[-1]
              print('story marked posted  : yes')
              print('story_id             :', last.get('story_id', '')[:16])
              print('message_id           :', last.get('message_id'))
              print('posted_at            :', last.get('posted_at'))
          else:
              print('story marked posted  : no')
          PYEOF

      - name: Save runtime state
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/news.db
            data/telegram_queue.json
            data/telegram_state.json
          key: world-news-runtime-${{ github.run_id }}
