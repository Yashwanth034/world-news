name: telegram publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent collector database
        # data/news.db holds the pipeline's dedup + event
        # memory (48h/168h retention). A per-run cache key
        # with a prefix restore-key carries the latest
        # database forward without ever committing it to
        # git.
        uses: actions/cache@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Collect fresh news
        # Generates data/telegram_queue.json in this
        # workspace so every cycle gets a fresh <=6h queue
        # built from the persistent news.db memory.
        run: |
          python -m src.main

      - name: Publish telegram messages
        run: |
          python -m src.telegram_run --yes
        env:
          TELEGRAM_PUBLISH: "1"

      - name: Commit queue and state
        # AT-LEAST-ONCE NARROWING: this step runs even when a
        # previous step fails (if: always), so a message that
        # was sent before a mid-run failure is recorded as
        # posted before the next run reads the state. The
        # remaining window is only an interrupted send where
        # the state could not be written at all. If nothing
        # changed, no commit is made.
        if: always()
        run: |
          if git diff --quiet -- data/telegram_queue.json data/telegram_state.json; then
            echo "no state changes"
          else
            git config user.name "telegram-bot"
            git config user.email "telegram-bot@localhost"
            git add data/telegram_queue.json data/telegram_state.json
            git commit -m "telegram queue+state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi
