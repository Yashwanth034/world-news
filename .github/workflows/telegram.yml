name: telegram publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch latest queue
        run: |
          git fetch origin main
          git checkout origin/main -- data/telegram_queue.json \
            || echo "no queue file on main yet"

      - name: Publish telegram messages
        run: |
          python src/telegram_run.py --yes
        env:
          TELEGRAM_PUBLISH: "1"

      - name: Commit state
        run: |
          if git diff --quiet -- data/telegram_state.json; then
            echo "no state changes"
          else
            git config user.name "telegram-bot"
            git config user.email "telegram-bot@localhost"
            git add data/telegram_state.json
            git commit -m "telegram state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi
