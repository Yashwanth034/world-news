name: telegram publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore runtime state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/news.db
            data/telegram_queue.json
            data/telegram_state.json
          key: world-news-runtime-${{ github.run_id }}
          restore-keys: |
            world-news-runtime-

      - name: Create data directory
        run: mkdir -p data

      - name: Collect fresh news
        id: collect
        run: python -m src.main

      - name: Publish telegram messages
        id: publish
        run: python -m src.telegram_run --yes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_PUBLISH: "1"

      - name: Save runtime state
        if: always() && steps.collect.outcome == 'success' && steps.publish.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/news.db
            data/telegram_queue.json
            data/telegram_state.json
          key: world-news-runtime-${{ github.run_id }}
